# Static public release profile for Nginx.
# Set STATIC_ROOT to the parent directory containing the `current` release.
# The deployment must point `current` at an immutable versioned release.
server {
    listen 80;
    server_name example.com;

    root /srv/example-release-root/current;
    autoindex off;

    # The editor is private and is never served by the public static host.
    location = /keystatic { return 404; }
    location ^~ /keystatic/ { return 404; }

    # Static routes only; no application upstream.
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
